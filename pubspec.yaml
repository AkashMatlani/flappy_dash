name: flappy_dash
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  flame: ^1.38.2
  flame_bloc: ^1.12.24
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.17.1

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/background/
    - assets/screenshots/

  fonts:
    - family: Chewy
      fonts:
        - asset: assets/fonts/Chewy-Regular.ttf

